[workspace]
resolver = "2"

[package]
name = "grr-cli"
version = "v0.7.0"
edition = "2024"
license = "MIT"
authors = ["Debanjan Basu <debanjanbasu2006@gmail.com>"]
repository = "https://github.com/debanjanbasu/grr-cli"
description = "Google tools from the terminal, at maximum performance: 401 methods across 14 Google APIs in one generated command tree, zero-config, over HTTP/3"
readme = "README.md"
keywords = ["google", "gmail", "http3", "cli", "oauth"]
categories = ["command-line-utilities", "api-bindings", "email", "network-programming", "web-programming"]

[lib]
name = "grr_cli"
path = "src/lib.rs"

[[bin]]
name = "grr"
path = "src/main.rs"
required-features = ["cli"]

[dependencies]
reqwest = { version = "0.13.5", default-features = false, features = ["http2", "http3", "rustls", "json", "form", "query", "stream", "gzip", "deflate", "zstd", "brotli"] }
tokio = { version = "1.53.1", features = ["macros", "rt-multi-thread", "sync", "time", "fs", "net", "io-util", "io-std"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
url = "2.5.8"
clap = { version = "4.6.7", features = ["derive", "env", "wrap_help", "string", "help", "usage", "cargo", "color", "unicode"] }
dirs = "7.0.0"
figment = { version = "0.10.19", features = ["env", "toml"] }
tracing = { version = "0.1.44", features = ["std"] }
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "fmt"], optional = true }
anyhow = "1.0.104"
thiserror = "2.0.21"
base64 = { version = "0.23.1", features = ["alloc", "std"] }
rand = { version = "0.10.3", features = ["std"] }
sha2 = "0.11.0"
urlencoding = "2.1.3"
open = "5.4"
num_cpus = "1.17"
keyring = { version = "4.2.0", features = ["windows-native-keyring-store", "apple-native-keyring-store", "zbus-secret-service-keyring-store"] }
comfy-table = "8.0"

# The io_uring availability probe (core::runtime) feeds `grr transport`'s
# report; the typed-client file-I/O path that used to share these deps is
# gone, but the probe is a shipped, documented feature.
[target.'cfg(target_os = "linux")'.dependencies]
tokio-uring = "0.5.0"
io-uring = "0.7.15"

[dev-dependencies]
wiremock = "0.6.5"
tempfile = "3.27.0"
assert_cmd = "2.2"
predicates = "3.1"

[features]
default = ["cli"]
# The typed service clients and their per-service features are gone: the
# command tree is generated from the embedded Discovery index, and the CLI
# needs only the engine â€” core (auth/HTTP), discovery, output formatting.
cli = ["dep:tracing-subscriber"]

[profile.dev]
opt-level = 1
panic = "abort"
incremental = true
debug = 1

[profile.dev.package."*"]
opt-level = 3

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
# Skips the panic hook and message formatting entirely; paired with
# build-std in .cargo/config.toml so std loses its panic strings too.
panic = "immediate-abort"
strip = "symbols"
incremental = false
overflow-checks = false
# Keep local filesystem paths out of distributed binaries.
trim-paths = "all"

[profile.release.build-override]
opt-level = 3

[profile.bench]
opt-level = 3
lto = "fat"
codegen-units = 1
debug = 1

[profile.test]
opt-level = 3
lto = "fat"
codegen-units = 1

