[build]
rustflags = [
    "--cfg", "reqwest_unstable",
    "--cfg", "hyper_unstable_ffi",
    "--cfg", "tokio_unstable",
]

# ──────────────────────────────────────────────────────────────────
# build-std: rebuild core/alloc/std from source with
# panic_immediate_abort — strips all panic formatting strings.
# Requires: `rustup component add rust-src`
# WARNING: panic messages become "panic in a function that cannot
# unwind" with zero context.
# ──────────────────────────────────────────────────────────────────
[unstable]
build-std = ["std", "panic_abort", "core", "alloc"]
panic-abort-tests = true
profile-rustflags = true
# Gates for `panic = "immediate-abort"` and `trim-paths` in Cargo.toml.
panic-immediate-abort = true
trim-paths = true

# VFE (-Zvirtual-function-elimination) requires nightly + LTO + embed-bitcode=yes,
# but the current nightly LLVM crashes with "Do not know how to promote this operator!"
# on bumpalo/core. lto = "fat" in Cargo.toml provides whole-program DCE.
# Release builds: clear dev flags; CI should set target-cpu per platform.
# macOS: RUSTFLAGS="-C target-cpu=apple-m1" (M1 baseline for distribution)
[profile.release]
rustflags = []

# ──────────────────────────────────────────────────────────────────
# Per-target optimizations
# NOTE: a [target.*] rustflags table REPLACES [build] rustflags —
# cargo does not merge them. So the three --cfg flags above must be
# repeated in every table below, or crates gating on them (reqwest
# http3, hyper ffi, tokio unstable) fail to compile on that target.
# ──────────────────────────────────────────────────────────────────

# Apple Silicon: M1 is the oldest supported Mac, so apple-m1 is a
# deterministic distribution baseline. (target-cpu=native would bake in
# whatever CPU the release runner happens to have.)
[target.aarch64-apple-darwin]
rustflags = ["-C", "target-cpu=apple-m1", "-C", "panic=abort", "--cfg", "reqwest_unstable", "--cfg", "hyper_unstable_ffi", "--cfg", "tokio_unstable"]

# Linux x86_64: baseline x86-64-v3 (Haswell+, AVX2/BMI2/FMA).
[target.x86_64-unknown-linux-gnu]
rustflags = ["-C", "target-cpu=x86-64-v3", "-C", "panic=abort", "--cfg", "reqwest_unstable", "--cfg", "hyper_unstable_ffi", "--cfg", "tokio_unstable"]

# Linux aarch64: portable ARMv8 baseline (generic), never the build host's
# CPU — the release runner is an ARM64 machine (GA) whose CPU would otherwise
# get baked into a binary distributed to older ARM boards too.
[target.aarch64-unknown-linux-gnu]
rustflags = ["-C", "target-cpu=generic", "-C", "panic=abort", "--cfg", "reqwest_unstable", "--cfg", "hyper_unstable_ffi", "--cfg", "tokio_unstable"]
linker = "aarch64-linux-gnu-gcc"

# Windows x86_64: baseline x86-64-v3 (Haswell+, AVX2/BMI2/FMA) with a
# statically linked CRT. v3 is safe as a distribution floor in 2026 —
# every cloud VM and any CPU since 2013 has it. +crt-static is the one
# deliberate portability fix here: a dynamic MSVC CRT means "exe does not
# run" on a clean sandbox (no VC++ redistributable), which winget's
# ValidationFailureGuide lists as a cause of Validation-Executable-Error.
[target.x86_64-pc-windows-msvc]
rustflags = ["-C", "target-cpu=x86-64-v3", "-C", "target-feature=+crt-static", "-C", "panic=abort", "--cfg", "reqwest_unstable", "--cfg", "hyper_unstable_ffi", "--cfg", "tokio_unstable"]

# Windows on ARM: Snapdragon X Elite/Plus (Oryon). oryon-1 excludes the
# pre-X Snapdragon 8cx devices (Surface Pro X and older), which are out of
# support. Repeat the --cfg flags: a [target.*] table replaces [build].
[target.aarch64-pc-windows-msvc]
rustflags = ["-C", "target-cpu=oryon-1", "-C", "target-feature=+crt-static", "-C", "panic=abort", "--cfg", "reqwest_unstable", "--cfg", "hyper_unstable_ffi", "--cfg", "tokio_unstable"]

