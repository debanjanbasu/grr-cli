name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "0 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    if: github.event_name != 'schedule'
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7
        timeout-minutes: 2
      - uses: dtolnay/rust-toolchain@nightly
        timeout-minutes: 5
        with:
          components: rust-src
      - uses: Swatinem/rust-cache@v2
        timeout-minutes: 5
        with:
          cache-bin: true
      - name: Install cargo-nextest
        uses: taiki-e/install-action@v2
        timeout-minutes: 5
        with:
          # The `nextest` tag this used to float on is an unversioned per-tool
          # ref from the pre-v2 era; v2 is the maintained line and names the
          # tool explicitly, so Dependabot can see what it is bumping.
          tool: nextest
      # No `cargo build` step before this: `cargo nextest run` compiles the
      # same lib + bin units, so a separate build only paid for that compile
      # twice on a cold cache. A build error surfaces here instead.
      - name: Test
        timeout-minutes: 30
        run: cargo nextest run --locked --all-features
      - name: Test doctests
        timeout-minutes: 15
        run: cargo test --locked --doc

  clippy:
    if: github.event_name != 'schedule'
    name: clippy
    runs-on: ubuntu-26.04-arm
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        timeout-minutes: 2
      - uses: dtolnay/rust-toolchain@nightly
        timeout-minutes: 5
        with:
          components: clippy, rust-src
      - uses: Swatinem/rust-cache@v2
        timeout-minutes: 5
      - name: Lint
        run: cargo clippy --all-targets --locked -- -D warnings

  fmt:
    if: github.event_name != 'schedule'
    name: fmt
    runs-on: ubuntu-26.04-arm
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        timeout-minutes: 2
      - uses: dtolnay/rust-toolchain@nightly
        timeout-minutes: 5
        with:
          components: rustfmt, rust-src
      - name: Check formatting
        run: cargo fmt --all -- --check

  scripts:
    if: github.event_name != 'schedule'
    name: scripts typecheck
    runs-on: ubuntu-26.04-arm
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        timeout-minutes: 2
      - uses: actions/setup-node@v7
        timeout-minutes: 5
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install script toolchain
        run: npm ci
      - name: Typecheck scripts
        run: npm run typecheck
      - name: Generated artifacts are current
        timeout-minutes: 5
        # These gates used to run inside the `test` matrix, which executed
        # them twice per PR (once on Linux, once on Windows). They compare
        # committed bytes against generator output, which is platform-
        # independent, so one Linux run covers both matrix legs.
        run: |
          node scripts/generate-commands.ts --check
          node scripts/generate-skills.ts --check
          node scripts/generate-coverage.ts --check

  site:
    # The site deploys straight from main (Cloudflare Pages builds it on
    # push), so a broken .astro file or a bad import would ship before anyone
    # noticed. Nothing else in this workflow compiles the site, which is why
    # this job exists.
    if: github.event_name != 'schedule'
    name: site (build + check)
    runs-on: ubuntu-26.04-arm
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        timeout-minutes: 2
      - uses: actions/setup-node@v7
        timeout-minutes: 5
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: site/package-lock.json
      - name: Install site dependencies
        run: npm ci
        working-directory: site
      - name: Type-check the Astro sources
        run: npm run check
        working-directory: site
      - name: Build the site
        run: npm run build
        working-directory: site

  feature-subset:
    # The per-service cargo features are gone; the one meaningful subset left
    # is a CLI-only build (`--no-default-features --features cli`). Lib+bins
    # only, deliberately not --all-targets: the integration tests exercise
    # the curated clients, which are not part of this subset.
    if: github.event_name != 'schedule'
    name: feature-subset (cli)
    runs-on: ubuntu-26.04-arm
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        timeout-minutes: 2
      - uses: dtolnay/rust-toolchain@nightly
        timeout-minutes: 5
        with:
          components: clippy, rust-src
      - uses: Swatinem/rust-cache@v2
        timeout-minutes: 5
        with:
          # Distinct key from the clippy job: a different feature set means a
          # different target dir; sharing a key would evict each other.
          key: cli-only
      - name: Clippy (no default features, cli only)
        run: cargo clippy --locked --no-default-features --features cli -- -D warnings

  security:
    name: security audit
    runs-on: ubuntu-26.04-arm
    timeout-minutes: 15
    continue-on-error: true
    permissions:
      contents: read
      issues: write
      checks: write
    steps:
      - uses: actions/checkout@v7
        timeout-minutes: 2
      - name: Audit Rust dependencies
        uses: rustsec/audit-check@v2
        timeout-minutes: 10
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
