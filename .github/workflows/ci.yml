name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "0 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    if: github.event_name != 'schedule'
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v5
        timeout-minutes: 2
      - uses: dtolnay/rust-toolchain@nightly
        timeout-minutes: 5
        with:
          components: rust-src
      - uses: Swatinem/rust-cache@v2
        timeout-minutes: 5
        with:
          cache-bin: true
      - uses: actions/setup-node@v5
        timeout-minutes: 5
        with:
          # The repo standard: .ts scripts run on Node's native type
          # stripping, which needs >= 23.6. No npm cache here — this job
          # never installs packages, it only runs node directly.
          node-version: "24"
      - name: Generated command tree is current
        run: node scripts/generate-commands.ts --check
      - name: Build
        run: cargo build --locked
      - name: Install cargo-nextest
        uses: taiki-e/install-action@nextest
        timeout-minutes: 5
      - name: Test
        run: cargo nextest run --locked --all-features
      - name: Test doctests
        run: cargo test --locked --doc

  clippy:
    if: github.event_name != 'schedule'
    name: clippy
    runs-on: ubuntu-26.04-arm
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
        timeout-minutes: 2
      - uses: dtolnay/rust-toolchain@nightly
        timeout-minutes: 5
        with:
          components: clippy, rust-src
      - uses: Swatinem/rust-cache@v2
        timeout-minutes: 5
      - name: Lint
        run: cargo clippy --all-targets --locked -- -D warnings

  fmt:
    if: github.event_name != 'schedule'
    name: fmt
    runs-on: ubuntu-26.04-arm
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
        timeout-minutes: 2
      - uses: dtolnay/rust-toolchain@nightly
        timeout-minutes: 5
        with:
          components: rustfmt, rust-src
      - name: Check formatting
        run: cargo fmt --all -- --check

  scripts:
    if: github.event_name != 'schedule'
    name: scripts typecheck
    runs-on: ubuntu-26.04-arm
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        timeout-minutes: 2
      - uses: actions/setup-node@v5
        timeout-minutes: 5
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install script toolchain
        run: npm ci
      - name: Typecheck scripts
        run: npm run typecheck

  feature-subset:
    # The per-service cargo features are gone; the one meaningful subset left
    # is a CLI-only build (`--no-default-features --features cli`). Lib+bins
    # only, deliberately not --all-targets: the integration tests exercise
    # the curated clients, which are not part of this subset.
    if: github.event_name != 'schedule'
    name: feature-subset (cli)
    runs-on: ubuntu-26.04-arm
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
        timeout-minutes: 2
      - uses: dtolnay/rust-toolchain@nightly
        timeout-minutes: 5
        with:
          components: clippy, rust-src
      - uses: Swatinem/rust-cache@v2
        timeout-minutes: 5
        with:
          # Distinct key from the clippy job: a different feature set means a
          # different target dir; sharing a key would evict each other.
          key: cli-only
      - name: Clippy (no default features, cli only)
        run: cargo clippy --locked --no-default-features --features cli -- -D warnings

  security:
    name: security audit
    runs-on: ubuntu-26.04-arm
    timeout-minutes: 15
    continue-on-error: true
    permissions:
      contents: read
      issues: write
      checks: write
    steps:
      - uses: actions/checkout@v5
        timeout-minutes: 2
      - name: Audit Rust dependencies
        uses: rustsec/audit-check@v2
        timeout-minutes: 10
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
