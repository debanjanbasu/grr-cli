name: Publish to crates.io

# The published crate is SOURCE ONLY. `build.rs` reads GRR_CLIENT_ID /
# GRR_CLIENT_SECRET from the build environment and bakes them in, but a
# crates.io consumer compiles the sources with no such variables set, so
# `cargo install grr-cli` produces a binary with no embedded OAuth client.
#
# That is deliberate rather than a packaging bug:
#   - Release binaries (GitHub Releases, Homebrew, winget) ARE built with the
#     secrets and are therefore zero-config.
#   - Source installs either set the two variables themselves, drop a `.env`
#     next to Cargo.toml (see .env.example), or run `grr auth setup`.
#
# Do NOT inject the secrets into this workflow: a `.crate` tarball must never
# contain a compiled-in credential, and injecting them here would only
# affect the local verification build, never the shipped artifact.
on:
  workflow_dispatch:
  push:
    tags: ["v*"]

concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  publish:
    name: publish grr-cli
    runs-on: ubuntu-latest
    timeout-minutes: 90
    environment: crates-io
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v5
        timeout-minutes: 2
      - uses: dtolnay/rust-toolchain@nightly
        timeout-minutes: 10
        with:
          components: rust-src
      - uses: Swatinem/rust-cache@v2
        timeout-minutes: 10
      - name: Authenticate with crates.io
        uses: rust-lang/crates-io-auth-action@v1
        timeout-minutes: 5
        id: auth
      - name: Publish grr-cli
        timeout-minutes: 60
        run: cargo publish --locked --no-verify
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
