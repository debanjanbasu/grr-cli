name: Dependabot auto-merge

# Patch updates merge immediately and unconditionally; minors and majors wait
# for CI to go green.
#
# Why patches are not gated: the repository's stated preference is to be on the
# latest patch even when that breaks something — a held-back patch is a known
# vulnerability or a fixed bug staying in the tree for another week, and the
# cost of a bad patch is one revert, not a silent outage. Minors and majors are
# where an API change can plausibly require a code edit, so those still go
# through the full suite.
#
# Detection: grouped patches carry the `patches` branch name. Dependabot can
# also open single-dependency branches, so parse their SemVer bump; unknown
# formats stay CI-gated.

on:
  pull_request_target:
    types: [opened, synchronize, reopened, ready_for_review]
  # Manual re-drive: the auto-merge can race a running check or lose the
  # event entirely (rebased branch, dropped webhook); a dispatch re-runs
  # the decision for the PR named in `pr_number` without waiting for
  # Dependabot to touch the branch again.
  workflow_dispatch:
    inputs:
      pr_number:
        description: "Pull request number to re-evaluate"
        required: true
        type: string

permissions:
  pull-requests: write
  contents: write      # required by mergePullRequest / enablePullRequestAutoMerge

concurrency:
  # One decision per pull request. Two runs (a `synchronize` landing while a
  # `reopened` is still queued) otherwise race on `gh pr merge`, and the loser
  # fails on a PR that is already merged — turning a successful auto-merge into
  # a red run. Queued rather than cancelled: being killed mid-merge is worse
  # than a duplicate no-op.
  group: dependabot-auto-merge-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  dependabot:
    if: github.actor == 'dependabot[bot]' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Resolve the PR number
        id: target
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          DISPATCH_NUMBER: ${{ inputs.pr_number }}
          EVENT_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            echo "pr_number=$DISPATCH_NUMBER" >> "$GITHUB_OUTPUT"
          else
            echo "pr_number=$EVENT_NUMBER" >> "$GITHUB_OUTPUT"
          fi

      - name: Decide patch vs. gated
        id: mode
        shell: bash
        env:
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
          PR_NUMBER: ${{ steps.target.outputs.pr_number }}
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          # A run queued behind a successful merge must not try to merge a PR
          # that is already merged: `gh pr merge` errors on one, which turned a
          # completed auto-merge into a red run on the next event (closed,
          # reopened, or a Dependabot rebase).
          state="$(gh pr view "$PR_NUMBER" --json state --jq '.state | ascii_downcase')"
          if [ "$state" != "open" ]; then
            echo "::notice::PR #$PR_NUMBER is $state; nothing left to decide."
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # A dispatch has no pull_request context: take the head ref from
          # the PR so the grouped-patch detection still works.
          if [ -z "$HEAD_REF" ]; then
            HEAD_REF="$(gh pr view "$PR_NUMBER" --json headRefName --jq .headRefName)"
          fi
          # Only bypass CI for a known patch update. Keep this tiny self-check
          # so a regex edit cannot accidentally classify a minor/major as patch.
          is_patch_update() {
            local title="$1"
            [[ "$title" =~ from[[:space:]]v?([0-9]+)\.([0-9]+)\.[0-9]+[[:space:]]to[[:space:]]v?([0-9]+)\.([0-9]+)\.[0-9]+ ]] &&
              [[ "${BASH_REMATCH[1]}.${BASH_REMATCH[2]}" == "${BASH_REMATCH[3]}.${BASH_REMATCH[4]}" ]]
          }
          if ! is_patch_update "Bump x from 1.2.3 to 1.2.4" ||
            is_patch_update "Bump x from 1.2.3 to 1.3.0" ||
            is_patch_update "Bump x from 1.2.3 to 2.0.0"; then
            echo "::error::Dependabot patch classification self-check failed"
            exit 1
          fi
          mode='gated'
          if [[ "$HEAD_REF" == *patches-* ]]; then
            mode='patch'
          else
            title="$(gh pr view "$PR_NUMBER" --json title --jq .title)"
            if is_patch_update "$title"; then
              mode='patch'
            fi
          fi
          echo "mode=$mode" >> "$GITHUB_OUTPUT"
          echo "head ref: $HEAD_REF -> $mode"

      - name: Merge a patch now, bypassing required checks
        if: steps.mode.outputs.skip != 'true' && steps.mode.outputs.mode == 'patch'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PR_NUMBER: ${{ steps.target.outputs.pr_number }}
        run: |
          # --admin is the point: it merges past pending required checks, which
          # is the whole intent for patches. If the token is not allowed to
          # bypass protection, fall back to auto-merge so the bump still lands
          # rather than sitting open forever.
          if output="$(gh pr merge "$PR_NUMBER" --squash --admin --delete-branch 2>&1)"; then
            printf '%s\n' "$output"
          elif printf '%s\n' "$output" | grep -qi "not allowed\|permission\|protected branch"; then
            printf '%s\n' "$output" >&2
            echo "::notice::Cannot bypass branch protection; falling back to auto-merge."
            gh pr merge "$PR_NUMBER" --squash --auto --delete-branch
          elif printf '%s\n' "$output" | grep -qi "required status checks are in progress"; then
            # --admin raced the checks: GitHub refuses to merge past checks
            # that are RUNNING (it only bypasses PENDING/failed). Not a
            # permission problem — the checks are mid-flight, so enable
            # auto-merge and let them finish; the merge fires on green.
            printf '%s\n' "$output" >&2
            echo "::notice::Checks still running; falling back to auto-merge."
            gh pr merge "$PR_NUMBER" --squash --auto --delete-branch
          else
            printf '%s\n' "$output" >&2
            exit 1
          fi

      - name: Enable auto-merge for a gated bump
        if: steps.mode.outputs.skip != 'true' && steps.mode.outputs.mode == 'gated'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PR_NUMBER: ${{ steps.target.outputs.pr_number }}
        run: |
          if output="$(gh pr merge "$PR_NUMBER" --squash --auto --delete-branch 2>&1)"; then
            printf '%s\n' "$output"
          elif printf '%s\n' "$output" | grep -qi "already enabled"; then
            printf '%s\n' "$output"
          else
            # Auto-merge enablement can race a concurrent enablement from the
            # same event burst; anything else is a real failure.
            printf '%s\n' "$output" >&2
            exit 1
          fi

      - name: Explain the decision
        if: steps.mode.outputs.skip != 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PR_NUMBER: ${{ steps.target.outputs.pr_number }}
          MODE: ${{ steps.mode.outputs.mode }}
        run: |
          if [ "$MODE" = "patch" ]; then
            gh pr comment "$PR_NUMBER" --body "Patch update: merging immediately without waiting for CI. This repository prefers the latest patch even if it regresses — a revert is cheaper than a held-back security fix."
          else
            gh pr comment "$PR_NUMBER" --body "Minor or major update: auto-merge is enabled and this will squash-merge once all required checks pass."
          fi
