name: Demo validation

# demo/demo.cast is the asciinema recording embedded on the site. It is
# GENERATED by scripts/generate-demo.ts, which runs the real grr binary and
# renders the frames with deterministic timing — but the committed recording
# can only be produced on the owner's machine (--local): the credential-backed
# segments (grr transport, grr ask) and the opencode agent segment need a
# Google token, a TypesSafe API key and opencode, none of which exist on a
# hosted runner.
#
# That splits the job in two:
#
#   - This workflow VALIDATES ONLY. It never regenerates demo/demo.cast and it
#     never opens a pull request: in CI the agent segment would be absent, so
#     a regenerated committed cast would differ by exactly the missing agent
#     segment — a PR would carry that regression. Regeneration is local
#     (`node scripts/generate-demo.ts --local`, then commit; see
#     demo/README.md).
#   - What it does check, in order:
#       1. the committed demo/demo.cast is well-formed asciicast v2 (JSON
#          lines: header + events), contains the expected offline command
#          sequence, and carries no private data (no Bearer, no key material,
#          no email address beyond `me`);
#       2. the offline generator pipeline still works end to end with no
#          credentials: grr (the published release binary, obtained
#          best-effort) renders a throwaway cast into $RUNNER_TEMP, which is
#          validated the same way. A throwaway path on purpose — the
#          committed file is never touched in CI;
#       3. the committed cast plays with real asciinema, not just our parser.
#
#   - grr is obtained best-effort on purpose (continue-on-error, same
#     reasoning as benchmark.yml's competitor installs): the published release
#     is the honest source for the offline-generation check, but a release
#     that cannot be obtained must never fail the run — the committed-cast
#     validation above stands on its own and the skip is recorded as a notice.

on:
  push:
    branches: [main]
    paths:
      - "demo/**"
      - "scripts/generate-demo.ts"
      - ".github/workflows/demo.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: demo
  cancel-in-progress: true

jobs:
  validate:
    name: validate demo.cast
    # ubuntu-26.04-arm IS a valid hosted runner label (GA per
    # actions/runner-images), but the grr release pipeline ships no
    # linux-arm64 artifact (release.yml builds linux-x86_64 only), and the
    # offline-generation check needs a runnable grr. Downloading the published
    # linux-x86_64 binary beats building grr from source (~25 runner minutes)
    # in a validation-only workflow, so the job runs on the x64 image.
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
        timeout-minutes: 5

      - uses: actions/setup-node@v5
        timeout-minutes: 5
        with:
          # Matches the Node version the other script-running workflows use.
          node-version: "24"

      # pipx is preinstalled on the runner images; pip on a 26.04 image refuses
      # --user installs into the system environment (PEP 668), hence the
      # fallback. Both land the binary in ~/.local/bin.
      - name: Install asciinema
        timeout-minutes: 5
        run: |
          set -euo pipefail
          pipx install asciinema || pip install --break-system-packages asciinema
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          asciinema --version

      # 1. The committed recording: structure + command sequence + privacy.
      #    Needs no grr binary, no credentials — only the file.
      - name: Validate committed demo.cast
        timeout-minutes: 3
        run: node scripts/generate-demo.ts --validate

      - name: Obtain grr (best effort)
        id: grr
        continue-on-error: true
        timeout-minutes: 5
        run: |
          set -euo pipefail
          command -v zstd >/dev/null || sudo apt-get install -y zstd
          dir="$RUNNER_TEMP/grr-bin"
          mkdir -p "$dir"
          url=$(curl -fsSL -H 'Accept: application/vnd.github+json' \
            "https://api.github.com/repos/${{ github.repository }}/releases/latest" \
            | node -e 'let d="";process.stdin.on("data",c=>d+=c).on("end",()=>{
                 const assets=(JSON.parse(d).assets)||[];
                 const a=assets.find(x=>/^grr-.*-linux-x86_64\.tar\.zst$/.test(x.name));
                 if(!a) process.exit(1);
                 console.log(a.browser_download_url);
               })')
          curl -fsSL "$url" -o "$RUNNER_TEMP/grr.tar.zst"
          zstd -d -f "$RUNNER_TEMP/grr.tar.zst" -o "$RUNNER_TEMP/grr.tar"
          tar -xf "$RUNNER_TEMP/grr.tar" -C "$dir"
          find "$dir" -type f -name grr -exec chmod +x {} \;
          GRR_BIN=$(find "$dir" -type f -name grr | head -1)
          test -x "$GRR_BIN"
          echo "GRR_BIN=$GRR_BIN" >> "$GITHUB_ENV"
          "$GRR_BIN" --version

      # 2. The offline generator pipeline, end to end, no credentials. A
      #    throwaway path on purpose: the committed demo.cast is never touched
      #    in CI, so the agent segment can never silently disappear from it.
      - name: Generate + validate a throwaway cast (offline)
        if: env.GRR_BIN != ''
        timeout-minutes: 5
        run: |
          set -euo pipefail
          node scripts/generate-demo.ts --out "$RUNNER_TEMP/demo-ci.cast"
          node scripts/generate-demo.ts --validate "$RUNNER_TEMP/demo-ci.cast"

      - name: Offline generation skipped
        if: env.GRR_BIN == ''
        timeout-minutes: 2
        run: |
          echo "::notice title=Offline generation skipped::no grr release binary could be obtained; the committed-cast validation above still stands."

      # 3. The artifact plays with real asciinema. --speed 100 renders the
      #    whole ~40s cast in under a second; output goes to /dev/null, only
      #    the exit code matters.
      - name: Smoke-play the committed cast
        timeout-minutes: 3
        run: |
          set -euo pipefail
          asciinema play --speed 100 demo/demo.cast > /dev/null

      - name: Summary
        timeout-minutes: 2
        run: |
          {
            echo "### Demo validation"
            echo
            echo "- committed \`demo/demo.cast\`: validated (asciicast v2, expected offline command sequence, no private data)"
            if [ -n "${GRR_BIN:-}" ]; then
              echo "- offline generation: re-rendered a throwaway cast with the published grr and validated it"
            else
              echo "- offline generation: skipped (no grr release binary obtainable)"
            fi
            echo "- regeneration is local by design: \`node scripts/generate-demo.ts --local\` (needs a Google token, a TypesSafe API key and opencode for the agent segment)"
          } >> "$GITHUB_STEP_SUMMARY"
