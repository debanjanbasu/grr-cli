name: Automation auto-merge

# Self-service merging for the PRs our own automation opens via
# peter-evans/create-pull-request (GITHUB_TOKEN authorship → `github-actions`).
#
# The problem: any workflow event authored by GITHUB_TOKEN lands its runs in
# `action_required` — GitHub refuses to auto-start CI for a token-created
# event. The PRs from changelog.yml / demo.yml / benchmark.yml / stats.yml /
# discovery.yml / auto-release.yml therefore sit with zero checks and can
# never merge on their own. This workflow is the unblocker: it approves the
# pending runs (the documented lever that lets the real ci.yml run and report
# its four required contexts) and then drives the merge with the same policy
# the repository already applies to Dependabot.
#
# Zero pwn-request surface: there is NO checkout of the PR head anywhere in
# this file. pull_request_target grants the *base* repo's secrets to the job,
# and every step only shells out to `gh` — PR code is never executed.

# GitHub's 2026-06 rollout gates bot-authored PR events: `pull_request` runs
# land in `action_required` and `pull_request_target` runs are not created at
# all (verified live: this workflow sat at zero runs while bot PRs opened and
# force-pushed all day). Schedule events are NOT approval-gated — they fire
# from main's workflow file regardless of actor — so the unblocker is a
# poller: every 10 minutes (and on demand via workflow_dispatch) it approves
# the pending runs and merges the allowlisted bot PRs.

on:
  schedule:
    # Every 10 minutes, off the top of the hour. The job is seconds when there
    # is nothing to do; the 10-minute ceiling on approval latency is the cost
    # of GitHub's approval gate, and far below the old manual-click latency.
    # Scheduling is best-effort (GitHub delays or drops ticks under load —
    # observed), so a push sweep below backs it up.
    - cron: "*/10 * * * *"
  # Every push to main by a human identity sweeps for pending bot PRs
  # immediately. The poller's own merges are token-authored and cannot
  # re-trigger this (no runs are created from token pushes), which is why
  # the schedule and the follow-up dispatches also exist.
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  actions: write        # approve pending (action_required) workflow runs
  pull-requests: write  # merge, comment, delete branches
  contents: write       # required by mergePullRequest / enablePullRequestAutoMerge —
                        # read-only tokens get "Resource not accessible by integration"

concurrency:
  # One decision per cycle: two scheduled runs must not race on `gh pr merge`
  # (the loser fails on a PR that is already merged — turning a completed
  # auto-merge into a red run). Queued rather than cancelled: being killed
  # mid-merge is worse than a duplicate no-op.
  group: automation-merge
  cancel-in-progress: false

jobs:
  approve-and-merge:
    # The poller enumerates the repo's own open bot PRs itself — there is no
    # per-PR event payload on a schedule trigger.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Enumerate open automation PRs
        id: prs
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          # The allowlist: the exact branch: values of the six workflows that
          # open bot PRs (create-pull-request in each). Anything else — a
          # human pushing to a chore/* branch, a renamed automation branch —
          # gets no merge help from this workflow. Forks cannot appear here:
          # the listing is scoped to this repository's open PRs.
          list="$(gh pr list --state open --json number,headRefName,author \
            --jq '.[] | select(
                    (.headRefName == "chore/changelog-regenerate" or
                     .headRefName == "chore/demo-recording" or
                     .headRefName == "chore/benchmark-refresh" or
                     .headRefName == "chore/stats-refresh" or
                     .headRefName == "chore/discovery-refresh" or
                     (.headRefName | test("^chore/release-v[0-9]+\\.[0-9]+\\.[0-9]+$")))
                  ) | "\(.number)|\(.headRefName)"')"
          # The release-bump pattern requires bare semver and rejects the
          # double-v form (chore/release-vv0.6.0) — the malformed manifest
          # this repo has already shipped once, which created an orphan vv
          # tag. That shape is a bug, never something to merge.
          echo "$list"
          { echo "prs<<EOF"; echo "$list"; echo "EOF"; } >> "$GITHUB_OUTPUT"

      - name: Approve pending CI runs, then merge
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PRS: ${{ steps.prs.outputs.prs }}
        run: |
          # GITHUB_TOKEN-authored events cannot start workflows, so the runs
          # for a bot push land in `action_required` and required checks
          # (test (ubuntu-latest), test (windows-latest), clippy, fmt) never
          # report. The approve API is the documented lever: approving a
          # pending run lets the real ci.yml execute and gate the merge like
          # any other PR. (Proven live: HTTP 201 on a pending run, which then
          # went in_progress and merged via --auto.)
          merge_artifact() {
            # Artifact-only PRs (changelog, demo, benchmark, stats) touch
            # nothing the test suite reads for its verdict on correctness —
            # they are self-validating generated artifacts, and a held-back
            # refresh rots exactly like a held-back patch. The repo's stated
            # philosophy for patches extends here: revert is cheaper than
            # staleness, so merge now with --admin and fall back to --auto if
            # protection refuses.
            local n="$1"
            if output="$(gh pr merge "$n" --squash --admin --delete-branch 2>&1)"; then
              printf '%s\n' "$output"
              gh pr comment "$n" --body "Artifact-only refresh: merged immediately with --admin."
              return 0
            fi
            # Any rejection — "protected branch", "not allowed", or the
            # expected "required status checks are expected" (the app token
            # is not an admin, so --admin has no bypass) — falls back to
            # native auto-merge: the approved CI run completes and GitHub
            # merges without another human or poller pass.
            printf '%s\n' "$output" >&2
            echo "::notice::--admin rejected; falling back to auto-merge."
            if out2="$(gh pr merge "$n" --squash --auto --delete-branch 2>&1)"; then
              printf '%s\n' "$out2"
            elif printf '%s\n' "$out2" | grep -qi "already enabled"; then
              printf '%s\n' "$out2"
            else
              printf '%s\n' "$out2" >&2
              return 1
            fi
            gh pr comment "$n" --body "Artifact-only refresh: auto-merge is enabled; it lands the moment the approved CI run goes green. These are self-validating generated artifacts — a revert is cheaper than a held-back refresh."
          }
          merge_code() {
            # Code-affecting PRs (discovery refresh rewrites the generated
            # command tree; the release bump arms tag→publish) get real CI and
            # only native auto-merge — NEVER --admin. Bypassing required
            # checks on a tree-changing merge is exactly what the checks
            # exist for.
            local n="$1"
            if output="$(gh pr merge "$n" --squash --auto --delete-branch 2>&1)"; then
              printf '%s\n' "$output"
            elif printf '%s\n' "$output" | grep -qi "already enabled\|pull request is closed\|not mergeable"; then
              printf '%s\n' "$output"
            else
              printf '%s\n' "$output" >&2
              return 1
            fi
            gh pr comment "$n" --body "Code-affecting automation PR: auto-merge is enabled and this will squash-merge once all required checks pass. Never admin-merged — real CI gates a tree-changing merge."
          }
          while IFS= read -r entry; do
            [ -z "$entry" ] && continue
            n="${entry%%|*}"; branch="${entry#*|}"
            case "$branch" in
              chore/discovery-refresh|chore/release-v*) mode_fn=merge_code ;;
              *) mode_fn=merge_artifact ;;
            esac
            # Approve every pending run for this head first — without an
            # approval the CI never starts and --auto can never complete.
            sha="$(gh pr view "$n" --json headRefOid --jq .headRefOid)"
            state="$(gh pr view "$n" --json state --jq '.state | ascii_downcase')"
            if [ "$state" != "open" ]; then
              echo "::notice::PR #$n is $state; skipping."
              continue
            fi
            ids="$(gh api --paginate \
              "repos/{owner}/{repo}/actions/runs?head_sha=$sha&status=action_required" \
              --jq '.workflow_runs[].id' || true)"
            if [ -n "$ids" ]; then
              for id in $ids; do
                echo "Approving run $id (PR #$n)"
                gh api -X POST "repos/{owner}/{repo}/actions/runs/$id/approve" >/dev/null
              done
            fi
            "$mode_fn" "$n" || echo "::warning::PR #$n merge did not complete this cycle; retried in 10 minutes."
            # --admin merges land immediately; --auto merges complete later.
            # Only the immediate kind can be observed in-cycle, and only it
            # needs the follow-up dispatches below.
            if [ "$(gh pr view "$n" --json state --jq .state)" = "MERGED" ]; then
              MERGED_THIS_CYCLE=1
            fi
          done <<< "$PRS"

          # A merge performed with GITHUB_TOKEN creates a push event that
          # starts NO downstream workflow runs (the documented anti-recursion
          # rule), so after our merges tag-release, CI-on-main and the
          # changelog refresh all stay silent. workflow_dispatch is an
          # explicit exception to that rule — and this exact gap is how the
          # v0.7.0 bump once merged without ever being tagged. Both checks
          # below are idempotent, so re-firing them every cycle is safe.
          echo "checking follow-ups"

          # 1. A pushed version must always have a tag — that is precisely
          #    tag-release's job, and it no-ops when the tag exists.
          ver="$(gh api -H 'Accept: application/vnd.github.raw' \
            "repos/{owner}/{repo}/contents/Cargo.toml" \
            | sed -n 's/^version = "\(.*\)"/\1/p' | head -1)"
          if [ -n "$ver" ] && ! git ls-remote "https://github.com/$GH_REPO" "refs/tags/v$ver" | grep -q .; then
            echo "version $ver has no tag; dispatching tag-release"
            gh workflow run tag-release.yml --ref main || echo "::warning::tag-release dispatch failed"
          fi

          # 2. In-cycle merges still need main's CI gate and the changelog
          #    refresh re-fired.
          if [ "${MERGED_THIS_CYCLE:-0}" = "1" ]; then
            gh workflow run ci.yml --ref main || echo "::warning::ci dispatch failed"
            gh workflow run changelog.yml --ref main || echo "::warning::changelog dispatch failed"
          fi
          echo "cycle complete"
